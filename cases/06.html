      <h1>ダークパターン事例⑥ ひっかけ質問</h1>
      <p class="definition">質問が二重否定であるなど、消費者が誤解しやすい表現になっているもの</p>
      <h2>【例】</h2>
      <ul class="examples">
          <li>チェックボックスの文章が「事業者からのお知らせを希望しません」となっており、希望しない場合はチェックを入れることになっている。文章が否定形で分かりにくく、消費者が配信を希望する場合にチェックを入れる形式が一般的であるため、消費者が誤解しやすい。</li>
      </ul>
