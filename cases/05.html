      <h1>ダークパターン事例⑤ 不当参照価格</h1>
      <p class="definition">誤解を招く又は虚偽の参照価格からの割引価格という形で価格が表示されているもの</p>
      <h2>【例】</h2>
      <ul class="examples">
          <li>初回、期間又は数量の限定の価格を通常の価格よりも大幅に割り引いているかのように強調している。大幅な値下げを強調しているが、これまで通常料金（11,000円）で販売していたかどうかの実績については不明である。</li>
