      <h1>ダークパターン事例⑫ お客様の声(1)</h1>
      <p class="definition">商品等を購入した他の消費者の評価や口コミに関する表示であって、誤解を招くものや虚偽の可能性があるもの</p>
      <h2>【例】</h2>
      <ul class="examples">
          <li>同一の商品に対し、PC及びスマートフォンそれぞれのウェブサイトにおいて、別の人物による口コミとして同じ内容が書かれているため、虚偽の口コミである可能性がある。</li>
