      <p class="definition">価格等を比較しづらくしているもの</p>
      <h2>【例】</h2>
      <ul class="examples">
          <li>複数のプランのうち、料金が一番高いプランだけが表示されており、「すべてのプランを見る」というボタンを押さないと、他のプランを確認することができず、価格の比較を妨害される。他のプランがあることを認識しないまま、意図せず高いプランを選択してしまう。</li>
      </ul>
